name: Delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never overlap production releases or cancel a deployment during its swap.
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      app_changed: ${{ steps.scope.outputs.app_changed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify application changes
        id: scope
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $changed = $true
          $edgeChanged = $true
          if ($env:GITHUB_EVENT_NAME -in @('push', 'pull_request')) {
            $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $event.pull_request.base.sha } else { $event.before }
            if ($base -match '^[a-f0-9]{40}$' -and $base -ne ('0' * 40)) {
              $paths = @(git diff --name-only $base $env:GITHUB_SHA)
              # Workflow definitions are omitted from the runtime release branch.
              $changed = @($paths | Where-Object { $_ -notmatch '^(README\.md|AGENTS\.md|PLAN\.md|HARNESS\.md|docs/.*|\.github/workflows/.*|\.gitignore|edge/.*|scripts/package-edge-release\.mjs|scripts/package-edge-release\.test\.mjs)$' }).Count -gt 0
              $edgeChanged = $changed -or @($paths | Where-Object { $_ -match '^(edge/|scripts/package-edge-release)' }).Count -gt 0
            }
          }
          "app_changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "edge_changed=$($edgeChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.scope.outputs.app_changed == 'true'
        with:
          global-json-file: global.json
      - name: Install locked dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
      - name: Check formatting and documentation links
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run format:check
          git diff --check HEAD^ HEAD
          foreach ($match in [regex]::Matches((Get-Content -Raw README.md), '\[[^\]]+\]\(([^)]+)\)')) {
            $target = $match.Groups[1].Value.Split('#')[0]
            if ($target -and $target -notmatch '^https?://' -and !(Test-Path -LiteralPath $target)) {
              throw "Missing README target: $target"
            }
          }
      - name: Install browser prerequisites and prepare the test database
        if: steps.scope.outputs.app_changed == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npx playwright install --with-deps chromium firefox webkit
          npm run setup
      - name: Run API/browser regression
        if: steps.scope.outputs.app_changed == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run verify
      - name: Verify gateway and package public assets
        if: steps.scope.outputs.edge_changed == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:edge
          node --test scripts/package-edge-release.test.mjs
          if ('${{ steps.scope.outputs.app_changed }}' -ne 'true') { npm run build }
          node scripts/package-edge-release.mjs $env:GITHUB_SHA
      - name: Retain the verified Cloudflare asset package
        if: steps.scope.outputs.edge_changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-edge-release
          path: .local/edge-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Package this revision and build its deployment image
        if: steps.scope.outputs.app_changed == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/package-release.ps1 -Revision $env:GITHUB_SHA
          docker build --tag onboardflow:verified .local/release/source
          docker build --file .local/release/source/deploy/hostless-probe/Dockerfile --tag onboardflow:ingress-probe .local/release/source
      - name: Retain the verified release bundle
        if: steps.scope.outputs.app_changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-release
          path: |
            .local/release/onboardflow-*.zip
            .local/release/release-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain test evidence
        if: always() && steps.scope.outputs.app_changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          # Only the explicit report paths below; never upload the whole .local directory.
          include-hidden-files: true
          path: |
            .local/reports/*.trx
            .local/reports/*/*.png
            .local/reports/intake-browser/**
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish verified Hostless source
    needs: verify
    if: github.repository == 'Dexter2099/client-onboarding-automation' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.app_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release
          path: .local/release
      - name: Publish the checked package to Hostless's deployment branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/publish-hostless-source.ps1
      - name: Verify the live Hostless release over HTTPS
        if: vars.HOSTLESS_ACCEPTANCE_ENABLED == 'true'
        run: node scripts/verify-hostless.mjs

  macos-browser:
    name: Verify live demo on macOS
    needs: deploy
    # Standard public-repository runner only; no production environment or secrets.
    # Real inference is opt-in. Zero-AI releases retain deterministic browser CI and HTTPS acceptance.
    if: needs.deploy.result == 'success' && github.event.repository.private == false && vars.HOSTLESS_ACCEPTANCE_ENABLED == 'true' && vars.LIVE_AI_ACCEPTANCE_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install the locked browser client
        run: |
          npm ci
          npx playwright install webkit
      - name: Verify this release as a macOS visitor
        run: node scripts/smoke-macos.mjs
      - name: Retain native macOS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-browser-evidence
          path: .local/macos-browser-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
